services:
  crypto_alpha_sniper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_alpha_sniper
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite+aiosqlite:///data/crypto_alpha_sniper.db
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
